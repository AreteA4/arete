[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arete-sdk"
version = "0.16.0"
description = "Python SDK for Arete"
requires-python = ">=3.9"
authors = [
    { name = "Arete Team" }
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Optional first-party Solana transaction adapter (arete.adapters.solders).
# solders 0.29 is the first release with transaction V1 (SIMD-0385) and needs
# Python >= 3.10; the base package stays >= 3.9 and never imports solders, so
# requesting this extra on 3.9 fails loudly instead of resolving to a
# V1-incapable solders.
solana = [
    "solders>=0.29,<0.30",
]

[project.urls]
Homepage = "https://arete.run"
Repository = "https://github.com/AreteA4/arete"
Documentation = "https://docs.arete.run"
Issues = "https://github.com/AreteA4/arete/issues"

[tool.setuptools.packages.find]
include = ["arete*"]
