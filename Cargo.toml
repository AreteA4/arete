[workspace]
resolver = "2"
members = [
    "arete",
    "arete-artifacts",
    "arete-hash",
    "interpreter",
    "arete-macros",
    "arete-idl",
    "cli",
    "rust/arete-server",
    "rust/arete-a4-sdk",
    "rust/arete-auth",
    "rust/arete-auth-server",
    "rust/arete-mcp",
]
exclude = [
    "stacks/pumpfun",
    "stacks/ore",
    "examples/rust-client",
    "examples/ore-server",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AreteA4/arete.git"
authors = ["Arete Team"]

[workspace.dependencies]
# Published ingestion tuple preserving Transaction V1 inline configuration.
# Shipstern requires client >=13.1, <13.3; keep the runtime, standalone slot
# subscription and protobuf conversion on the same tested type family.
shipstern = "=0.9.0"
shipstern-core = "=0.9.0"
shipstern-yellowstone-grpc-source = "=0.9.0"
yellowstone-grpc-client = "=13.2.1"
yellowstone-grpc-proto = "=12.7.0"
