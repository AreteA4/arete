[workspace]
resolver = "2"
members = [
    "arete",
    "arete-artifacts",
    "arete-hash",
    "interpreter",
    "arete-macros",
    "arete-idl",
    "cli",
    "rust/arete-server",
    "rust/arete-a4-sdk",
    "rust/arete-auth",
    "rust/arete-auth-server",
    "rust/arete-mcp",
]
exclude = [
    "stacks/pumpfun",
    "stacks/ore",
    "examples/rust-client",
    "examples/ore-server",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AreteA4/arete.git"
authors = ["Arete Team"]

[workspace.dependencies]
# Yellowstone Vixen ecosystem.
# Pinned to exact versions: vixen 0.6.1 relies on `yellowstone-grpc-proto`
# 12.x, but proto 12.2.0 added required `cuckoo_*` fields that 0.6.1 does not
# populate. Hold the grpc crates at 12.1.0, the latest proto/client line that
# matches the published 0.6.1 Vixen API.
yellowstone-vixen = "=0.6.1"
yellowstone-vixen-core = "=0.6.1"
yellowstone-vixen-proto = "=0.6.1"
yellowstone-vixen-yellowstone-grpc-source = "=0.6.1"
# Yellowstone gRPC client (for standalone slot subscriptions)
yellowstone-grpc-client = "=12.1.0"
yellowstone-grpc-proto = "=12.1.0"
