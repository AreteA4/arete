name: Surfpool Geyser Plugin Release

# Builds the Yellowstone gRPC geyser plugin for one pinned Surfpool release
# (scripts/surfpool-geyser/pins.json) and publishes it as the
# `surfpool-geyser-v<surfpool version>` release for Arete cloud dev environments:
#
#   libyellowstone_grpc_geyser-<platform>.{dylib,so}, manifest-<platform>.json,
#   yellowstone-grpc.json, checksums.txt, checksums.txt.minisig
#
# checksums.txt is signed with the release key, trusted comment
# `surfpool-geyser-v<surfpool version>`.

on:
  workflow_dispatch:
    inputs:
      surfpool_version:
        description: Surfpool release to build the plugin for (a key of scripts/surfpool-geyser/pins.json)
        required: true
        type: string
      publish:
        description: Upload to the release (otherwise build and sign only, and keep the files as a workflow artifact)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: surfpool-geyser-${{ inputs.surfpool_version }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the pin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check that the Surfpool version is pinned
        id: pin
        env:
          SURFPOOL_VERSION: ${{ inputs.surfpool_version }}
        run: |
          if [[ ! "$SURFPOOL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::surfpool_version must be X.Y.Z, got '$SURFPOOL_VERSION'"
            exit 1
          fi
          if ! jq -e --arg v "$SURFPOOL_VERSION" '.pins[$v]' scripts/surfpool-geyser/pins.json; then
            echo "::error::Surfpool $SURFPOOL_VERSION has no pin in scripts/surfpool-geyser/pins.json"
            exit 1
          fi
          echo "version=$SURFPOOL_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      # The build fetches and compiles third-party code; leave no git
      # credential on disk for it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libudev-dev libssl-dev pkg-config clang jq

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf jq

      - name: Build the plugin
        env:
          SURFPOOL_VERSION: ${{ needs.check.outputs.version }}
        run: scripts/surfpool-geyser/build.sh --surfpool "$SURFPOOL_VERSION" --out "$RUNNER_TEMP/geyser"

      - name: Stage the release assets
        env:
          SURFPOOL_VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          src="$RUNNER_TEMP/geyser/$SURFPOOL_VERSION/$PLATFORM"
          manifest="$src/manifest.json"
          if [[ "$(jq -r .platform "$manifest")" != "$PLATFORM" || "$(jq -r .surfpool "$manifest")" != "$SURFPOOL_VERSION" ]]; then
            echo "::error::$manifest does not describe Surfpool $SURFPOOL_VERSION on $PLATFORM"
            exit 1
          fi
          lib="$(jq -r .library.file "$manifest")"
          mkdir -p assets
          asset="libyellowstone_grpc_geyser-$PLATFORM.${lib##*.}"
          cp "$src/$lib" "assets/$asset"
          jq --arg file "$asset" '.library.file = $file' "$manifest" > "assets/manifest-$PLATFORM.json"
          # The template's libpath names the platform's library; consumers
          # set it to the absolute path, so the published template has none
          # and is the same on every platform.
          jq 'del(.libpath)' "$src/yellowstone-grpc.json" > "assets/yellowstone-grpc.$PLATFORM.json"
          ls -l assets

      - name: Upload the platform's assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geyser-${{ matrix.platform }}
          path: assets/
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the platforms' assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: geyser-*
          path: assets
          merge-multiple: true

      - name: Keep one config template
        run: |
          first=""
          for template in assets/yellowstone-grpc.*.json; do
            if [[ -z "$first" ]]; then
              first="$template"
            elif ! cmp -s "$first" "$template"; then
              echo "::error::$first and $template differ"
              exit 1
            fi
          done
          if [[ -z "$first" ]]; then
            echo "::error::no config template was built"
            exit 1
          fi
          cp "$first" assets/yellowstone-grpc.json
          rm -f assets/yellowstone-grpc.*.json
          ls -l assets

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: Sign checksums and upload to the release
        env:
          A4_MINISIGN_SECRET_KEY: ${{ secrets.A4_MINISIGN_SECRET_KEY }}
          A4_MINISIGN_PASSWORD: ${{ secrets.A4_MINISIGN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SURFPOOL_VERSION: ${{ needs.check.outputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" != "true" ]]; then
            export DRY_RUN=1
          fi
          scripts/sign-and-upload-external-assets.sh "surfpool-geyser-v$SURFPOOL_VERSION" assets

      - name: Keep the signed assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surfpool-geyser-v${{ needs.check.outputs.version }}
          path: assets/
          if-no-files-found: error
