name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing linked release version, without the v prefix
        required: true
        type: string
      source_sha:
        description: Full reviewed commit SHA on main to build and publish
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain used to build recovery artifacts
        required: true
        default: 1.97.0
        type: string
      publish:
        description: Publish crates, upload assets, and publish missing npm packages
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RECOVER followed by a space and the version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: recover-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate recovery source
    runs-on: ubuntu-latest
    outputs:
      idl_version: ${{ steps.validate.outputs.idl_version }}
      hash_version: ${{ steps.validate.outputs.hash_version }}
      artifacts_version: ${{ steps.validate.outputs.artifacts_version }}
      typescript_hash_version: ${{ steps.validate.outputs.typescript_hash_version }}
      auth_version: ${{ steps.validate.outputs.auth_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Validate release state
        id: validate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase, full 40-character commit SHA"
            exit 1
          fi

          if [[ ! "${{ inputs.rust_toolchain }}" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "rust_toolchain must be an exact stable toolchain version"
            exit 1
          fi

          if [[ "$CONFIRMATION" != "RECOVER $VERSION" ]]; then
            echo "confirmation must exactly match: RECOVER $VERSION"
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "Checked out commit does not match source_sha"
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "$SOURCE_SHA is not on origin/main"
            exit 1
          fi

          METADATA="$(cargo metadata --locked --no-deps --format-version 1)"
          crate_version() {
            jq -r --arg name "$1" '.packages[] | select(.name == $name) | .version' <<<"$METADATA"
          }

          LINKED_CRATES=(
            arete
            arete-interpreter
            arete-macros
            arete-a4-sdk
            arete-server
            a4-cli
            arete-mcp
          )

          for crate in "${LINKED_CRATES[@]}"; do
            actual="$(crate_version "$crate")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "Expected $crate@$VERSION, found $actual"
              exit 1
            fi
          done

          for package_json in \
            typescript/core/package.json \
            typescript/react/package.json \
            typescript/adapters/kit/package.json \
            typescript/adapters/web3js/package.json \
            packages/arete/package.json \
            packages/mcp/package.json; do
            if ! jq -e --arg version "$VERSION" '.version == $version' "$package_json" >/dev/null; then
              echo "Expected $package_json to have version $VERSION"
              exit 1
            fi
          done

          IDL_VERSION="$(crate_version arete-idl)"
          HASH_VERSION="$(crate_version arete-hash)"
          ARTIFACTS_VERSION="$(crate_version arete-artifacts)"
          TYPESCRIPT_HASH_VERSION="$(jq -r '.version' typescript/hash/package.json)"
          AUTH_VERSION="$(crate_version arete-auth)"
          echo "idl_version=$IDL_VERSION" >> "$GITHUB_OUTPUT"
          echo "hash_version=$HASH_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifacts_version=$ARTIFACTS_VERSION" >> "$GITHUB_OUTPUT"
          echo "typescript_hash_version=$TYPESCRIPT_HASH_VERSION" >> "$GITHUB_OUTPUT"
          echo "auth_version=$AUTH_VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags --force
          RELEASE_TAGS=(
            "arete-v$VERSION"
            "arete-interpreter-v$VERSION"
            "arete-macros-v$VERSION"
            "arete-sdk-v$VERSION"
            "arete-server-v$VERSION"
            "a4-cli-v$VERSION"
            "arete-mcp-v$VERSION"
            "arete-idl-v$IDL_VERSION"
            "arete-hash-v$HASH_VERSION"
            "arete-artifacts-v$ARTIFACTS_VERSION"
            "arete-hash-npm-v$TYPESCRIPT_HASH_VERSION"
            "arete-auth-v$AUTH_VERSION"
            "arete-typescript-v$VERSION"
            "arete-react-v$VERSION"
            "arete-adapter-kit-v$VERSION"
            "arete-adapter-web3js-v$VERSION"
            "a4-npm-v$VERSION"
            "arete-mcp-npm-v$VERSION"
          )

          for tag in "${RELEASE_TAGS[@]}"; do
            gh release view "$tag" >/dev/null
            tag_sha="$(git rev-list -n 1 "$tag")"
            if ! git merge-base --is-ancestor "$tag_sha" "$SOURCE_SHA"; then
              echo "$SOURCE_SHA is not descended from $tag"
              exit 1
            fi
          done

          RELEASE_SHA="$(git rev-list -n 1 "arete-v$VERSION")"
          HASH_NPM_RELEASE_SHA="$(git rev-list -n 1 "arete-hash-npm-v$TYPESCRIPT_HASH_VERSION")"
          NPM_PACKAGES=(
            "@usearete/hash|$TYPESCRIPT_HASH_VERSION"
            "@usearete/sdk|$VERSION"
            "@usearete/react|$VERSION"
            "@usearete/adapter-kit|$VERSION"
            "@usearete/adapter-web3js|$VERSION"
            "@usearete/a4|$VERSION"
            "@usearete/mcp|$VERSION"
          )

          for package_spec in "${NPM_PACKAGES[@]}"; do
            package="${package_spec%%|*}"
            package_version="${package_spec#*|}"
            expected_git_head="$RELEASE_SHA"
            if [[ "$package" == "@usearete/hash" ]]; then
              expected_git_head="$HASH_NPM_RELEASE_SHA"
            fi
            encoded_name="${package//@/%40}"
            encoded_name="${encoded_name//\//%2F}"
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --user-agent 'arete-release-workflow (https://github.com/AreteA4/arete)' \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/${encoded_name}/${package_version}")"

            case "$status" in
              200)
                git_head="$(jq -r '.gitHead // empty' "$response_file")"
                # Recovery publishes from a staged directory without .git, so npm may omit gitHead.
                if [[ -n "$git_head" && "$git_head" != "$expected_git_head" && "$git_head" != "$SOURCE_SHA" ]]; then
                  echo "$package@$package_version has unexpected npm gitHead: $git_head"
                  rm -f "$response_file"
                  exit 1
                fi
                ;;
              404)
                ;;
              *)
                echo "Unable to check $package@$package_version on npm (HTTP $status)"
                cat "$response_file"
                rm -f "$response_file"
                exit 1
                ;;
            esac

            rm -f "$response_file"
          done

          while IFS= read -r changed_file; do
            case "$changed_file" in
              .github/workflows/ci.yml|.github/workflows/release-please.yml|.github/workflows/release-recovery.yml|.release-please-manifest.json|arete/Cargo.toml|arete-artifacts/Cargo.toml|arete-hash/Cargo.toml|cli/Cargo.toml|release-please-config.json|rust/arete-mcp/Cargo.toml|scripts/publish-crate.sh|scripts/publish-npm-package.sh|scripts/publish-npm-version.sh|scripts/test-npm-publish-auth.sh|scripts/upload-release-asset.sh|stacks/ore/Cargo.lock|typescript/hash/package.json|typescript/hash/package-lock.json)
                ;;
              *)
                echo "Recovery source contains an unapproved change: $changed_file"
                echo "Create a new release instead of recovering the existing version"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "arete-v$VERSION..$SOURCE_SHA")

          echo "Recovery source differs from the release tag by:"
          git diff --stat "arete-v$VERSION..$SOURCE_SHA"

  publish-rust:
    name: Publish missing Rust crates
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ./scripts/publish-crate.sh arete-idl --allow-existing
          ./scripts/publish-crate.sh arete-hash --allow-existing
          ./scripts/publish-crate.sh arete-artifacts --allow-existing
          ./scripts/publish-crate.sh arete-macros --allow-existing
          ./scripts/publish-crate.sh interpreter --allow-existing
          ./scripts/publish-crate.sh rust/arete-auth --allow-existing
          ./scripts/publish-crate.sh rust/arete-server --allow-existing
          ./scripts/publish-crate.sh rust/arete-a4-sdk --allow-existing
          ./scripts/publish-crate.sh arete --allow-existing
          ./scripts/publish-crate.sh cli --allow-existing
          ./scripts/publish-crate.sh rust/arete-mcp --allow-existing

  build-binaries:
    name: Build ${{ matrix.binary_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package: a4-cli
            source_name: a4
            binary_name: a4-darwin-arm64
            release: a4-cli
            artifact_prefix: cli
          - os: macos-15-large
            target: x86_64-apple-darwin
            package: a4-cli
            source_name: a4
            binary_name: a4-darwin-x64
            release: a4-cli
            artifact_prefix: cli
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: a4-cli
            source_name: a4
            binary_name: a4-linux-x64
            release: a4-cli
            artifact_prefix: cli
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: a4-cli
            source_name: a4
            binary_name: a4-linux-arm64
            release: a4-cli
            artifact_prefix: cli
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: a4-cli
            source_name: a4.exe
            binary_name: a4-win32-x64.exe
            release: a4-cli
            artifact_prefix: cli
          - os: macos-latest
            target: aarch64-apple-darwin
            package: arete-mcp
            source_name: a4-mcp
            binary_name: a4-mcp-darwin-arm64
            release: arete-mcp
            artifact_prefix: mcp
          - os: macos-15-large
            target: x86_64-apple-darwin
            package: arete-mcp
            source_name: a4-mcp
            binary_name: a4-mcp-darwin-x64
            release: arete-mcp
            artifact_prefix: mcp
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: arete-mcp
            source_name: a4-mcp
            binary_name: a4-mcp-linux-x64
            release: arete-mcp
            artifact_prefix: mcp
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: arete-mcp
            source_name: a4-mcp
            binary_name: a4-mcp-linux-arm64
            release: arete-mcp
            artifact_prefix: mcp
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: arete-mcp
            source_name: a4-mcp.exe
            binary_name: a4-mcp-win32-x64.exe
            release: arete-mcp
            artifact_prefix: mcp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Reuse existing release binary
        id: release-binary
        if: ${{ inputs.publish }}
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.release }}-v${{ inputs.version }}
        run: |
          release="$(gh release view "$RELEASE_TAG" --json assets)"
          if jq -e --arg name "$BINARY_NAME" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<<"$release" >/dev/null; then
            gh release download "$RELEASE_TAG" --pattern "$BINARY_NAME" --dir .
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $BINARY_NAME from $RELEASE_TAG"
          elif jq -e --arg name "$BINARY_NAME" 'any(.assets[]; .name == $name)' <<<"$release" >/dev/null; then
            echo "Existing asset $BINARY_NAME on $RELEASE_TAG is not fully uploaded"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Install Rust toolchain
        if: steps.release-binary.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross && steps.release-binary.outputs.exists != 'true'
        run: |
          pip3 install ziglang==0.16.0
          cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build binary
        if: steps.release-binary.outputs.exists != 'true'
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cargo zigbuild --locked --release --target "${{ matrix.target }}" --package "${{ matrix.package }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}" --package "${{ matrix.package }}"
          fi
        shell: bash

      - name: Rename binary
        if: steps.release-binary.outputs.exists != 'true'
        run: cp "target/${{ matrix.target }}/release/${{ matrix.source_name }}" "${{ matrix.binary_name }}"
        shell: bash

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.binary_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary_name }}" | Out-File -FilePath "${{ matrix.binary_name }}.sha256" -Encoding ascii

      - name: Upload checksum artifact
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_prefix }}-sha256-${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.sha256

      - name: Validate rebuilt binary against existing checksums
        if: ${{ inputs.publish && steps.release-binary.outputs.exists != 'true' }}
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ matrix.release }}-v${{ inputs.version }}
        run: |
          release="$(gh release view "$RELEASE_TAG" --json assets)"
          if jq -e 'any(.assets[]; .name == "checksums.txt" and .state == "uploaded" and .size > 0)' <<<"$release" >/dev/null; then
            mkdir -p existing-checksums
            gh release download "$RELEASE_TAG" --pattern checksums.txt --dir existing-checksums
            expected_hash="$(
              tr -d '\r' < existing-checksums/checksums.txt |
                while read -r hash asset_name; do
                  if [[ "$asset_name" == "$BINARY_NAME" ]]; then
                    echo "$hash"
                  fi
                done
            )"
            read -r actual_hash _ < "${BINARY_NAME}.sha256"
            if [[ -z "$expected_hash" || "$actual_hash" != "$expected_hash" ]]; then
              echo "Rebuilt $BINARY_NAME does not match checksums.txt on $RELEASE_TAG"
              exit 1
            fi
          elif jq -e 'any(.assets[]; .name == "checksums.txt")' <<<"$release" >/dev/null; then
            echo "Existing checksums.txt on $RELEASE_TAG is not fully uploaded"
            exit 1
          fi
        shell: bash

      - name: Upload binary to release
        if: ${{ inputs.publish && steps.release-binary.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/upload-release-asset.sh "${{ matrix.release }}-v${VERSION}" "${{ matrix.binary_name }}"
        shell: bash

  publish-checksums:
    name: Publish binary checksums
    if: ${{ inputs.publish }}
    needs: [validate, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download CLI checksums
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: cli-sha256-*
          path: cli-checksums
          merge-multiple: true

      - name: Download MCP checksums
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: mcp-sha256-*
          path: mcp-checksums
          merge-multiple: true

      - name: Combine and publish checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          publish_checksums() {
            local release_tag="$1"
            local checksum_dir="$2"
            local release
            local existing_dir="$checksum_dir/existing"

            for checksum_file in "$checksum_dir"/*.sha256; do
              tr -d '\r' < "$checksum_file"
            done | LC_ALL=C sort > "$checksum_dir/checksums.txt"

            release="$(gh release view "$release_tag" --json assets)"
            if jq -e 'any(.assets[]; .name == "checksums.txt" and .state == "uploaded" and .size > 0)' <<<"$release" >/dev/null; then
              mkdir -p "$existing_dir"
              gh release download "$release_tag" --pattern checksums.txt --dir "$existing_dir"
              tr -d '\r' < "$existing_dir/checksums.txt" | LC_ALL=C sort > "$checksum_dir/existing-checksums.txt"
              if cmp -s "$checksum_dir/checksums.txt" "$checksum_dir/existing-checksums.txt"; then
                echo "Reusing checksums.txt from $release_tag"
                return
              fi
              echo "Refusing to replace checksums.txt with checksums for non-identical binaries on $release_tag"
              exit 1
            elif jq -e 'any(.assets[]; .name == "checksums.txt")' <<<"$release" >/dev/null; then
              echo "Existing checksums.txt on $release_tag is not fully uploaded"
              exit 1
            fi

            ./scripts/upload-release-asset.sh "$release_tag" "$checksum_dir/checksums.txt"
          }

          publish_checksums "a4-cli-v${VERSION}" cli-checksums
          publish_checksums "arete-mcp-v${VERSION}" mcp-checksums
        shell: bash

  bundle-templates:
    name: Bundle CLI templates
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Check existing template bundle
        id: release-templates
        env:
          ASSET_NAME: arete-templates-v${{ inputs.version }}.tar.gz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: a4-cli-v${{ inputs.version }}
        run: |
          release="$(gh release view "$RELEASE_TAG" --json assets)"
          if jq -e --arg name "$ASSET_NAME" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<<"$release" >/dev/null; then
            gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir .
            tar -tzf "$ASSET_NAME" >/dev/null
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing $ASSET_NAME from $RELEASE_TAG"
          elif jq -e --arg name "$ASSET_NAME" 'any(.assets[]; .name == $name)' <<<"$release" >/dev/null; then
            echo "Existing asset $ASSET_NAME on $RELEASE_TAG is not fully uploaded"
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup Node.js
        if: steps.release-templates.outputs.exists != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install Rust toolchain
        if: steps.release-templates.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Prepare and bundle templates
        if: steps.release-templates.outputs.exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/prepare-example-templates.sh "$VERSION"
          tar -czvf "arete-templates-v${VERSION}.tar.gz" \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='package-lock.json' \
            --exclude='target' \
            --exclude='Cargo.lock' \
            -C examples \
            ore-react \
            ore-rust \
            ore-typescript

      - name: Upload templates to release
        if: steps.release-templates.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/upload-release-asset.sh "a4-cli-v${VERSION}" "arete-templates-v${VERSION}.tar.gz"

  publish-npm:
    name: Publish missing npm packages
    if: ${{ inputs.publish }}
    needs:
      [
        validate,
        publish-rust,
        build-binaries,
        publish-checksums,
        bundle-templates,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for provenance
        run: npm install --global npm@11

      - name: Publish missing packages in dependency order
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish-npm-version.sh "${{ inputs.version }}"
