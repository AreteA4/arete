name: Release Please

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed main commit to release (40 lowercase hexadecimal characters)
        required: true
        type: string
      rust_toolchain:
        description: Exact Rust toolchain version used for release builds (for example 1.89.0)
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: oss-release-publication
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      arete_release_created: ${{ steps.release.outputs['arete--release_created'] }}
      interpreter_release_created: ${{ steps.release.outputs['interpreter--release_created'] }}
      macros_release_created: ${{ steps.release.outputs['arete-macros--release_created'] }}
      server_release_created: ${{ steps.release.outputs['rust/arete-server--release_created'] }}
      sdk_release_created: ${{ steps.release.outputs['rust/arete-a4-sdk--release_created'] }}
      cli_version: ${{ steps.release.outputs['cli--version'] }}
      cli_release_created: ${{ steps.release.outputs['cli--release_created'] }}
      mcp_version: ${{ steps.release.outputs['rust/arete-mcp--version'] }}
      mcp_release_created: ${{ steps.release.outputs['rust/arete-mcp--release_created'] }}
      idl_release_created: ${{ steps.release.outputs['arete-idl--release_created'] }}
      hash_release_created: ${{ steps.release.outputs['arete-hash--release_created'] }}
      artifacts_release_created: ${{ steps.release.outputs['arete-artifacts--release_created'] }}
      auth_release_created: ${{ steps.release.outputs['rust/arete-auth--release_created'] }}
      typescript_hash_release_created: ${{ steps.release.outputs['typescript/hash--release_created'] }}
      core_version: ${{ steps.release.outputs['typescript/core--version'] }}
      core_release_created: ${{ steps.release.outputs['typescript/core--release_created'] }}
      react_release_created: ${{ steps.release.outputs['typescript/react--release_created'] }}
      adapter_kit_release_created: ${{ steps.release.outputs['typescript/adapters/kit--release_created'] }}
      adapter_web3js_release_created: ${{ steps.release.outputs['typescript/adapters/web3js--release_created'] }}
      python_release_created: ${{ steps.release.outputs['python/arete-sdk--release_created'] }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact reviewed main commit and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUST_TOOLCHAIN" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" refs/remotes/origin/main
          test "$(gh run list --workflow ci.yml --commit "$SOURCE_COMMIT" --json conclusion --jq 'map(select(.conclusion == "success")) | length')" -gt 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Validate Rust release metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr:
    name: Synchronize Release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Synchronize release PR artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ needs.release-please.outputs.pr }}
        run: |
          RELEASE_BRANCH="$(node -e 'process.stdout.write(JSON.parse(process.env.RELEASE_PR).headBranchName)')"
          git fetch origin "$RELEASE_BRANCH"
          git switch --detach "origin/$RELEASE_BRANCH"

          bash ./scripts/sync-release-artifacts.sh

          if git diff --quiet; then
            echo "Release artifacts are already synchronized"
          else
            git diff --check
            bash ./scripts/check-lockfile-sync.sh
            cargo metadata --locked --format-version 1 > /dev/null
            cargo metadata --manifest-path stacks/ore/Cargo.toml --locked --format-version 1 > /dev/null

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: synchronize release artifacts"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

          gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  publish-rust:
    name: Publish Rust Crates to crates.io
    needs: release-please
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.releases_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Publish in dependency order; the helper waits for crates.io propagation.
      - name: Publish arete-idl
        if: needs.release-please.outputs.idl_release_created == 'true'
        run: ./scripts/publish-crate.sh arete-idl

      - name: Publish arete-hash
        if: needs.release-please.outputs.hash_release_created == 'true'
        run: ./scripts/publish-crate.sh arete-hash

      - name: Publish arete-artifacts
        if: needs.release-please.outputs.artifacts_release_created == 'true'
        run: ./scripts/publish-crate.sh arete-artifacts

      - name: Publish arete-macros
        if: needs.release-please.outputs.macros_release_created == 'true'
        run: ./scripts/publish-crate.sh arete-macros

      - name: Publish arete-interpreter
        if: needs.release-please.outputs.interpreter_release_created == 'true'
        run: ./scripts/publish-crate.sh interpreter

      - name: Publish arete-auth
        if: needs.release-please.outputs.auth_release_created == 'true'
        run: ./scripts/publish-crate.sh rust/arete-auth

      - name: Publish arete-server
        if: needs.release-please.outputs.server_release_created == 'true'
        run: ./scripts/publish-crate.sh rust/arete-server

      - name: Publish arete-a4-sdk
        if: needs.release-please.outputs.sdk_release_created == 'true'
        run: ./scripts/publish-crate.sh rust/arete-a4-sdk

      - name: Publish arete (umbrella)
        if: needs.release-please.outputs.arete_release_created == 'true'
        run: ./scripts/publish-crate.sh arete

      - name: Publish arete-mcp
        if: needs.release-please.outputs.mcp_release_created == 'true'
        run: ./scripts/publish-crate.sh rust/arete-mcp

      # a4-cli depends on arete-mcp, so it must publish after it; a failed
      # step also skips every later step in this job.
      - name: Publish a4-cli
        if: needs.release-please.outputs.cli_release_created == 'true'
        run: ./scripts/publish-crate.sh cli

  # Runs unconditionally and no-ops when no SDK was released, so downstream
  # jobs can list it in `needs` without inheriting a skip. A skipped `needs`
  # entry would skip its dependents, which would silently disable template
  # bundling and CLI publication on releases that do not move the SDK.
  verify-generated-rust-crates:
    name: Verify Generated Rust Consumers Against crates.io
    needs: [release-please, publish-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.release-please.outputs.sdk_release_created == 'true' || needs.release-please.outputs.arete_release_created == 'true'

      - name: Install Rust toolchain
        if: needs.release-please.outputs.sdk_release_created == 'true' || needs.release-please.outputs.arete_release_created == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      # Generated program/stack crates must resolve the exact published
      # arete-a4-sdk from crates.io with no [patch.crates-io] or path
      # dependency. A failure here is a publication-ordering or version
      # contract failure; do not loosen the generated constraint to hide it.
      - name: Check generated Rust crates build from the registry
        if: needs.release-please.outputs.sdk_release_created == 'true'
        run: bash ./scripts/check-generated-rust-crates.sh --mode registry

      - name: Check generated ingestion runtime from the registry
        if: needs.release-please.outputs.arete_release_created == 'true'
        run: bash ./scripts/check-generated-ingestion-runtime.sh --mode registry

      - name: No Rust consumer release in this run
        if: needs.release-please.outputs.sdk_release_created != 'true' && needs.release-please.outputs.arete_release_created != 'true'
        run: echo "No arete or arete-a4-sdk release in this run; nothing to verify."

  publish-npm:
    name: Publish to npm
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.release-please.outputs.typescript_hash_release_created == 'true' ||
      needs.release-please.outputs.core_release_created == 'true' ||
      needs.release-please.outputs.react_release_created == 'true' ||
      needs.release-please.outputs.adapter_kit_release_created == 'true' ||
      needs.release-please.outputs.adapter_web3js_release_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Install hash dependencies
        if: needs.release-please.outputs.typescript_hash_release_created == 'true'
        run: npm ci
        working-directory: typescript/hash

      - name: Build hash
        if: needs.release-please.outputs.typescript_hash_release_created == 'true'
        run: npm run build
        working-directory: typescript/hash

      - name: Publish hash
        if: needs.release-please.outputs.typescript_hash_release_created == 'true'
        run: ../../scripts/publish-npm-package.sh .
        working-directory: typescript/hash

      # Build @usearete/sdk first so every downstream package uses this checkout.
      - name: Install core dependencies
        if: >-
          needs.release-please.outputs.core_release_created == 'true' ||
          needs.release-please.outputs.react_release_created == 'true' ||
          needs.release-please.outputs.adapter_kit_release_created == 'true' ||
          needs.release-please.outputs.adapter_web3js_release_created == 'true'
        run: npm ci
        working-directory: typescript/core

      - name: Build core
        if: >-
          needs.release-please.outputs.core_release_created == 'true' ||
          needs.release-please.outputs.react_release_created == 'true' ||
          needs.release-please.outputs.adapter_kit_release_created == 'true' ||
          needs.release-please.outputs.adapter_web3js_release_created == 'true'
        run: npm run build
        working-directory: typescript/core

      - name: Publish core
        if: needs.release-please.outputs.core_release_created == 'true'
        run: ../../scripts/publish-npm-package.sh .
        working-directory: typescript/core

      - name: Wait for core registry propagation
        if: needs.release-please.outputs.core_release_created == 'true'
        env:
          CORE_VERSION: ${{ needs.release-please.outputs.core_version }}
        run: |
          for attempt in {1..30}; do
            published_version="$(npm view "@usearete/sdk@${CORE_VERSION}" version 2>/dev/null || true)"
            if [[ "$published_version" == "$CORE_VERSION" ]]; then
              echo "@usearete/sdk@${CORE_VERSION} is available"
              exit 0
            fi
            echo "Waiting for @usearete/sdk@${CORE_VERSION} (attempt ${attempt}/30)"
            sleep 10
          done
          echo "::error::@usearete/sdk@${CORE_VERSION} did not propagate within 5 minutes"
          exit 1
        shell: bash

      - name: Install React dependencies
        if: needs.release-please.outputs.react_release_created == 'true'
        run: npm install ../core --no-save --package-lock=false
        working-directory: typescript/react

      - name: Build react
        if: needs.release-please.outputs.react_release_created == 'true'
        run: npm run build
        working-directory: typescript/react

      - name: Publish react
        if: needs.release-please.outputs.react_release_created == 'true'
        run: ../../scripts/publish-npm-package.sh .
        working-directory: typescript/react

      - name: Install Kit adapter dependencies
        if: needs.release-please.outputs.adapter_kit_release_created == 'true'
        run: npm install ../../core --no-save --package-lock=false
        working-directory: typescript/adapters/kit

      - name: Build Kit adapter
        if: needs.release-please.outputs.adapter_kit_release_created == 'true'
        run: npm run build
        working-directory: typescript/adapters/kit

      - name: Publish Kit adapter
        if: needs.release-please.outputs.adapter_kit_release_created == 'true'
        run: ../../../scripts/publish-npm-package.sh .
        working-directory: typescript/adapters/kit

      - name: Install web3.js adapter dependencies
        if: needs.release-please.outputs.adapter_web3js_release_created == 'true'
        run: npm install ../../core --no-save --package-lock=false
        working-directory: typescript/adapters/web3js

      - name: Build web3.js adapter
        if: needs.release-please.outputs.adapter_web3js_release_created == 'true'
        run: npm run build
        working-directory: typescript/adapters/web3js

      - name: Publish web3.js adapter
        if: needs.release-please.outputs.adapter_web3js_release_created == 'true'
        run: ../../../scripts/publish-npm-package.sh .
        working-directory: typescript/adapters/web3js

  bundle-templates:
    name: Bundle CLI Templates
    # verify-generated-rust-crates must pass before any CLI template or CLI
    # package is published: a generated crate that cannot resolve the freshly
    # published SDK is a version-contract failure, and shipping the CLI first
    # would hand users a broken generator.
    needs:
      [release-please, publish-npm, publish-rust, verify-generated-rust-crates]
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.cli_release_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Prepare example templates
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          ./scripts/prepare-example-templates.sh "$VERSION"

      - name: Create templates tarball
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          echo "Bundling templates for version ${VERSION}"

          # Create tarball with only the template directories (excluding build artifacts)
          tar -czvf "arete-templates-v${VERSION}.tar.gz" \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='package-lock.json' \
            --exclude='target' \
            --exclude='Cargo.lock' \
            -C examples \
            ore-react \
            ore-rust \
            ore-typescript

      - name: Upload templates to CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          ./scripts/upload-release-asset.sh \
            "a4-cli-v${VERSION}" \
            "arete-templates-v${VERSION}.tar.gz"

  build-cli-binaries:
    name: Build CLI Binaries
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: a4-darwin-arm64
          - os: macos-15-large
            target: x86_64-apple-darwin
            binary_name: a4-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: a4-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: a4-linux-arm64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: a4-win32-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Build scripts and dependencies run in this job; do not leave a
      # write-capable git credential on disk for them. The release upload
      # step uses GH_TOKEN explicitly.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross
        run: |
          pip3 install ziglang==0.16.0
          cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --locked --release --target ${{ matrix.target }} --package a4-cli
          else
            cargo build --locked --release --target ${{ matrix.target }} --package a4-cli
          fi
        shell: bash

      - name: Rename binary
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/a4.exe ${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/a4 ${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "${{ matrix.binary_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary_name }}" | Out-File -FilePath "${{ matrix.binary_name }}.sha256" -Encoding ascii

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-sha256-${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}.sha256

      # Build provenance for humans/agents with `gh`:
      #   gh attestation verify <file> -R AreteA4/arete
      # Installers do not depend on it; they verify the minisign signature.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ matrix.binary_name }}

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          ./scripts/upload-release-asset.sh \
            "a4-cli-v${VERSION}" \
            "${{ matrix.binary_name }}"
        shell: bash

  publish-cli-checksums:
    name: Publish CLI Checksums
    needs: [release-please, build-cli-binaries]
    runs-on: ubuntu-latest
    if: needs.release-please.outputs.cli_release_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download checksum artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: cli-sha256-*
          path: checksums
          merge-multiple: true

      - name: Combine checksums
        # Strip CR: the Windows checksum is written with PowerShell Out-File
        # (CRLF), which otherwise breaks manifest asset-name matching.
        run: cat checksums/*.sha256 | tr -d '\r' | LC_ALL=C sort > checksums.txt

      - name: Write release manifest
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          ./scripts/write-release-manifest.sh "$VERSION" checksums.txt > manifest.json
          cat manifest.json
        shell: bash

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          minisign -v

      - name: Sign checksums with minisign
        env:
          A4_MINISIGN_SECRET_KEY: ${{ secrets.A4_MINISIGN_SECRET_KEY }}
          A4_MINISIGN_PASSWORD: ${{ secrets.A4_MINISIGN_PASSWORD }}
        run: ./scripts/sign-release-checksums.sh "${{ needs.release-please.outputs.cli_version }}" checksums.txt
        shell: bash

      - name: Upload checksums, signature and manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.cli_version }}"
          for asset in checksums.txt checksums.txt.minisig manifest.json; do
            ./scripts/upload-release-asset.sh "a4-cli-v${VERSION}" "$asset"
          done
        shell: bash

  publish-npm-cli:
    name: Publish CLI to npm
    needs:
      [
        release-please,
        build-cli-binaries,
        publish-cli-checksums,
        bundle-templates,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: needs.release-please.outputs.cli_release_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Publish arete CLI wrapper
        run: ../../scripts/publish-npm-package.sh .
        working-directory: packages/arete

  # The MCP server now ships inside `a4` (`a4 mcp`); @usearete/mcp publishes
  # one final deprecated version and no longer depends on MCP binaries.
  publish-npm-mcp:
    name: Publish MCP to npm
    needs: [release-please]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: needs.release-please.outputs.mcp_release_created == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11

      - name: Publish arete MCP wrapper
        run: ../../scripts/publish-npm-package.sh .
        working-directory: packages/mcp

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: release-please
    if: needs.release-please.outputs.python_release_created == 'true'
    runs-on: ubuntu-latest
    environment: oss-pypi-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Build Python SDK distributions
        working-directory: python/arete-sdk
        run: |
          python -m pip install --disable-pip-version-check build==1.4.4
          python -m build

      - name: Publish Python SDK with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/arete-sdk/dist/
