name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-crate-files:
    name: Check Rust Crate LICENSE and README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Rust crates have LICENSE and README.md
        run: |
          #!/bin/bash
          set -e

          # Extract Rust package paths from release-please-config.json
          # We filter for packages with "release-type": "rust"
          RUST_CRATES=$(jq -r '.packages | to_entries[] | select(.value."release-type" == "rust") | .key' release-please-config.json)

          MISSING_FILES=0

          echo "Checking Rust crates listed in release-please..."
          echo ""

          for crate_path in $RUST_CRATES; do
            echo "Checking: $crate_path"

            # Check for LICENSE file
            if [ ! -f "$crate_path/LICENSE" ] && [ ! -f "$crate_path/LICENSE.txt" ] && [ ! -f "$crate_path/LICENSE-MIT" ] && [ ! -f "$crate_path/LICENSE-APACHE" ] && [ ! -f "$crate_path/LICENCE" ]; then
              echo "  ❌ MISSING: LICENSE file not found"
              MISSING_FILES=$((MISSING_FILES + 1))
            else
              echo "  ✓ LICENSE found"
            fi

            # Check for README.md file
            if [ ! -f "$crate_path/README.md" ]; then
              echo "  ❌ MISSING: README.md file not found"
              MISSING_FILES=$((MISSING_FILES + 1))
            else
              echo "  ✓ README.md found"
            fi

            echo ""
          done

          if [ $MISSING_FILES -gt 0 ]; then
            echo "::error::$MISSING_FILES required file(s) missing across Rust crates"
            exit 1
          fi

          echo "✓ All Rust crates have required LICENSE and README.md files"

  lockfile-sync:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check npm lockfiles match manifests
        run: bash ./scripts/check-lockfile-sync.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo test --workspace

      - name: Test direct artifact macros
        run: cargo test -p arete-macros --test artifact_native_v2

      - name: Test V1/V2 artifacts and multi-LiveSpec composition
        run: cargo test -p arete-interpreter --test public_artifacts

      - name: Test selected views and aliased SDK composition
        run: cargo test -p a4-cli compose_ && cargo test -p a4-cli local_multi_live_generation

      - name: Build standalone ORE stack
        run: cargo build --manifest-path stacks/ore/Cargo.toml --locked

      - name: Test standalone ORE stack
        run: cargo test --manifest-path stacks/ore/Cargo.toml --locked

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  generated-example-sdks:
    name: Generated Example SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            examples/ore-typescript/package-lock.json

      - name: Regenerate example SDKs
        run: bash ./scripts/generate-example-sdks.sh

      - name: Check generated SDKs and ORE AST are committed
        run: |
          if [[ -n "$(git status --porcelain -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated)" ]]; then
            git status --short -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated
            exit 1
          fi

      - name: Regenerate example SDKs a second time
        run: bash ./scripts/generate-example-sdks.sh

      - name: Check SDK generation is deterministic
        run: |
          if [[ -n "$(git status --porcelain -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated)" ]]; then
            git status --short -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated
            exit 1
          fi

      - name: Build local TypeScript SDK
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install TypeScript example dependencies
        working-directory: examples/ore-typescript
        run: npm ci && npm install ../../typescript/core --no-save --package-lock=false

      - name: Strict compile TypeScript example
        working-directory: examples/ore-typescript
        run: npx tsc --noEmit

  ore-react:
    name: ORE React App
    needs: generated-example-sdks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.18.0"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/react/package-lock.json
            typescript/adapters/web3js/package-lock.json
            examples/ore-react/package-lock.json

      - name: Build local SDK
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Build local React SDK
        working-directory: typescript/react
        run: npm ci && npm install ../core --no-save --package-lock=false && npm run build

      - name: Build local web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm ci && npm install ../../core --no-save --package-lock=false && npm run build

      - name: Install app dependencies
        working-directory: examples/ore-react
        run: |
          npm ci
          npm install ../../typescript/core ../../typescript/react ../../typescript/adapters/web3js --no-save --package-lock=false

      - name: Install Chromium
        working-directory: examples/ore-react
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: examples/ore-react
        run: npm run typecheck

      - name: Lint
        working-directory: examples/ore-react
        run: npm run lint

      - name: Unit and component tests
        working-directory: examples/ore-react
        run: npm test

      - name: Build
        working-directory: examples/ore-react
        run: npm run build

      - name: Disconnected browser tests
        working-directory: examples/ore-react
        run: npm run test:e2e

      - name: Verify one SDK version
        working-directory: examples/ore-react
        run: npm ls @usearete/sdk

  typescript-core:
    name: TypeScript Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/core
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: typescript/core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  typescript-hash:
    name: TypeScript Hash
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/hash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: typescript/hash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test packed package boundary
        run: npm run test:pack

  typescript-adapters:
    name: TypeScript Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.18.0"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/adapters/kit/package-lock.json
            typescript/adapters/web3js/package-lock.json

      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install Kit adapter dependencies
        working-directory: typescript/adapters/kit
        run: npm ci && npm install ../../core --no-save --package-lock=false

      - name: Typecheck Kit adapter
        working-directory: typescript/adapters/kit
        run: npm run typecheck

      - name: Test Kit adapter
        working-directory: typescript/adapters/kit
        run: npm test

      - name: Build Kit adapter
        working-directory: typescript/adapters/kit
        run: npm run build

      - name: Pack-smoke Kit adapter
        working-directory: typescript/adapters/kit
        run: node pack-smoke.mjs

      - name: Install web3.js adapter dependencies
        working-directory: typescript/adapters/web3js
        run: npm ci && npm install ../../core --no-save --package-lock=false

      - name: Typecheck web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm run typecheck

      - name: Test web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm test

      - name: Build web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm run build

      - name: Pack-smoke web3.js adapter
        working-directory: typescript/adapters/web3js
        run: node scripts/pack-smoke.mjs

  typescript-react:
    name: TypeScript React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install dependencies
        working-directory: typescript/react
        run: npm ci && npm install ../core --no-save --package-lock=false

      - name: Typecheck
        working-directory: typescript/react
        run: npm run typecheck

      - name: Lint
        working-directory: typescript/react
        run: npm run lint

      - name: Build
        working-directory: typescript/react
        run: npm run build

      - name: Test
        working-directory: typescript/react
        run: npm test

      - name: Pack and public-export smoke
        working-directory: typescript/react
        run: |
          npm pack --dry-run --json >/tmp/arete-react-pack.json
          node --input-type=module -e "const sdk = await import('./dist/index.esm.js'); for (const name of ['AreteProvider', 'useArete', 'useAsyncRead', 'createProcessedSlotReconciliation', 'formatRawToUi', 'summarizeStatuses', 'isHostedAreteEndpoint']) { if (!(name in sdk)) throw new Error('Missing ESM export: ' + name); } for (const removed of ['useView', 'useEntity']) { if (removed in sdk) throw new Error('Removed ESM export still present: ' + removed); }"
          node -e "const sdk = require('./dist/index.cjs'); for (const name of ['AreteProvider', 'useArete', 'useAsyncRead', 'createProcessedSlotReconciliation', 'formatRawToUi', 'summarizeStatuses', 'isHostedAreteEndpoint']) { if (!(name in sdk)) throw new Error('Missing CJS export: ' + name); } for (const removed of ['useView', 'useEntity']) { if (removed in sdk) throw new Error('Removed CJS export still present: ' + removed); }"
          node -e "const plugin = require('./eslint-plugin.cjs'); if (!plugin.rules?.['fluent-hooks']) throw new Error('Missing fluent-hooks ESLint rule');"

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/arete-sdk
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest
        # continue-on-error: true

      - name: Run tests
        run: pytest || echo "No tests found or tests skipped"
        # continue-on-error: true

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
