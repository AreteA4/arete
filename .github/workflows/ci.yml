name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main are
# never cancelled: each commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request can affect, so the rest can skip. See
  # scripts/ci-affected-jobs.sh for the rules. Every gated job runs unless this
  # job positively reports `false`: when it fails, or on a push or manual run
  # where the step below does not run, the outputs are empty and everything
  # runs. A skipped job counts as passing for required checks, so skipping on
  # anything but a positive decision would let an unverified change merge.
  changes:
    name: Detect affected jobs
    runs-on: ubuntu-latest
    outputs:
      rust-workspace: ${{ steps.affected.outputs.rust-workspace }}
      rust-features: ${{ steps.affected.outputs.rust-features }}
      rust-consumers: ${{ steps.affected.outputs.rust-consumers }}
      rust-clippy: ${{ steps.affected.outputs.rust-clippy }}
      rust-solana-adapter: ${{ steps.affected.outputs.rust-solana-adapter }}
      windows-cli-lifecycle: ${{ steps.affected.outputs.windows-cli-lifecycle }}
      generated-example-sdks: ${{ steps.affected.outputs.generated-example-sdks }}
      ore-react: ${{ steps.affected.outputs.ore-react }}
      typescript-core: ${{ steps.affected.outputs.typescript-core }}
      typescript-hash: ${{ steps.affected.outputs.typescript-hash }}
      typescript-dev-ui: ${{ steps.affected.outputs.typescript-dev-ui }}
      typescript-protocol: ${{ steps.affected.outputs.typescript-protocol }}
      typescript-automations: ${{ steps.affected.outputs.typescript-automations }}
      typescript-automations-postgres: ${{ steps.affected.outputs.typescript-automations-postgres }}
      typescript-adapters: ${{ steps.affected.outputs.typescript-adapters }}
      typescript-react: ${{ steps.affected.outputs.typescript-react }}
      python-matrix: ${{ steps.affected.outputs.python-matrix }}
      docs: ${{ steps.affected.outputs.docs }}
      benchmarks: ${{ steps.affected.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      # A pull_request run checks out the merge commit, so comparing it with
      # its first parent is exactly what this pull request would change, even
      # if the base branch has moved. --no-renames lists both sides of a rename:
      # moving a file out of a crate still affects that crate.
      - name: Compare the merge commit with its base
        id: affected
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify --quiet 'HEAD^2' >/dev/null
          changed="$(git diff --name-only --no-renames 'HEAD^1' HEAD)"
          printf 'Changed paths:\n%s\n\nDecisions:\n' "$changed"
          printf '%s\n' "$changed" | bash ./scripts/ci-affected-jobs.sh | tee -a "$GITHUB_OUTPUT"

  check-crate-files:
    name: Check Rust Crate LICENSE and README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Rust crates have LICENSE and README.md
        run: |
          #!/bin/bash
          set -e

          # Extract Rust package paths from release-please-config.json
          # We filter for packages with "release-type": "rust"
          RUST_CRATES=$(jq -r '.packages | to_entries[] | select(.value."release-type" == "rust") | .key' release-please-config.json)

          MISSING_FILES=0

          echo "Checking Rust crates listed in release-please..."
          echo ""

          for crate_path in $RUST_CRATES; do
            echo "Checking: $crate_path"

            # Check for LICENSE file
            if [ ! -f "$crate_path/LICENSE" ] && [ ! -f "$crate_path/LICENSE.txt" ] && [ ! -f "$crate_path/LICENSE-MIT" ] && [ ! -f "$crate_path/LICENSE-APACHE" ] && [ ! -f "$crate_path/LICENCE" ]; then
              echo "  ❌ MISSING: LICENSE file not found"
              MISSING_FILES=$((MISSING_FILES + 1))
            else
              echo "  ✓ LICENSE found"
            fi

            # Check for README.md file
            if [ ! -f "$crate_path/README.md" ]; then
              echo "  ❌ MISSING: README.md file not found"
              MISSING_FILES=$((MISSING_FILES + 1))
            else
              echo "  ✓ README.md found"
            fi

            echo ""
          done

          if [ $MISSING_FILES -gt 0 ]; then
            echo "::error::$MISSING_FILES required file(s) missing across Rust crates"
            exit 1
          fi

          echo "✓ All Rust crates have required LICENSE and README.md files"

  lockfile-sync:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Check npm lockfiles match manifests
        run: bash ./scripts/check-lockfile-sync.sh

  linked-release-versions:
    name: Linked Release Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Test linked release validation
        run: node --test ./scripts/check-linked-release-versions.test.mjs ./scripts/sync-release-artifacts.test.mjs ./scripts/publish-npm-version.test.mjs

      - name: Test example template release conversion
        run: bash ./scripts/test-update-example-versions.sh

      - name: Check linked release versions
        run: node ./scripts/check-linked-release-versions.mjs

      - name: Check minisign public key is identical in all four embeddings
        run: bash ./scripts/check-minisign-pubkey.sh

      - name: Test Surfpool plugin build paths and release staging
        run: python3 ./scripts/surfpool-geyser/test.py

      - name: Check the compiled-in registry signing keys
        run: bash ./scripts/update-registry-keys.sh --check

      - name: Syntax-check install.sh (POSIX sh)
        run: sh -n docs/public/install.sh

      # Release Recovery rejects a rust_toolchain input that differs from
      # rust-toolchain.toml, so its default must move with every toolchain bump.
      - name: Check Release Recovery defaults to the pinned Rust toolchain
        run: |
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          default="$(yq -r '.on.workflow_dispatch.inputs.rust_toolchain.default' .github/workflows/release-recovery.yml)"
          if [ "$default" != "$pinned" ]; then
            echo "release-recovery.yml defaults rust_toolchain to $default, but rust-toolchain.toml pins $pinned"
            exit 1
          fi

      - name: Require the verified-tree marker to wait for every job
        run: bash ./scripts/check-verified-tree-needs.sh .github/workflows/ci.yml

      - name: Test the verified-tree lookup the release gate uses
        run: bash ./scripts/test-find-verified-tree.sh

      - name: Test which jobs a pull request's changes can skip
        run: bash ./scripts/test-ci-affected-jobs.sh

  npm-cli-wrapper:
    name: npm CLI Wrapper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/arete
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Test
        run: npm test

  npm-publish-auth:
    name: npm Publishing Authentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Test publishing authentication selection
        run: bash ./scripts/test-npm-publish-auth.sh

  rust-workspace:
    name: Rust workspace tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust-workspace != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      # Line tables keep file and line numbers in panics while making the
      # cached target directories smaller and links faster.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-workspace
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --locked

      # The three steps below re-run named targets and tests that the workspace
      # run above already includes. Using the same workspace selection means
      # they compile nothing new, and --test still fails if a target is removed.
      - name: Test direct artifact macros
        run: cargo test --workspace --locked --test artifact_native_v2

      # `--test public_artifacts` selects fewer targets than the workspace run,
      # so cargo resolves features differently and recompiles about 80 crates
      # first. Run the binary the workspace run already built instead: this
      # compiles nothing and still fails if the target is removed. The test
      # reads its fixtures with include_bytes!, so running it directly is safe.
      - name: Test V1/V2 artifacts and multi-LiveSpec composition
        run: |
          bin="$(cargo test --workspace --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "public_artifacts" and (.target.kind | index("test")) and .executable != null) | .executable')"
          test -n "$bin"
          cd interpreter && "$bin"

      - name: Test selected views and aliased SDK composition
        run: cargo test --workspace --locked --lib --bins --tests compose_ && cargo test --workspace --locked --lib --bins --tests local_multi_live_generation

  rust-features:
    name: Rust feature variants
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust-features != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      # Line tables keep file and line numbers in panics while making the
      # cached target directories smaller and links faster.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-features
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test snapshot object-store feature
        run: |
          cargo test --locked -p arete-server --features snapshot-object-store
          cargo clippy --locked -p arete-server --features snapshot-object-store -- -D warnings

  rust-consumers:
    name: Rust generated consumers
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust-consumers != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      # Line tables keep file and line numbers in panics while making the
      # cached target directories smaller and links faster.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # The generated crates and the standalone ORE stack live outside the
      # workspace. One target directory lets them reuse each other's compiled
      # dependencies instead of each building its own.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ". -> target"
          shared-key: rust-consumers
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check generated Rust crates build against the linked SDK (pre-publication)
        run: bash ./scripts/check-generated-rust-crates.sh --mode local

      - name: Check generated ingestion runtime (pre-publication)
        run: bash ./scripts/check-generated-ingestion-runtime.sh --mode local

      - name: Build standalone ORE stack
        run: cargo build --manifest-path stacks/ore/Cargo.toml --locked

      - name: Test standalone ORE stack
        run: cargo test --manifest-path stacks/ore/Cargo.toml --locked

  rust-clippy:
    name: Rust clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust-clippy != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      # Line tables keep file and line numbers in panics while making the
      # cached target directories smaller and links faster.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-clippy
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy checks a4 with the dev UI embedded, as release builds have it:
      # under A4_REQUIRE_DEV_UI, cli/build.rs fails when the UI is missing,
      # and include_bytes! reads every embedded file. The UI is built the way
      # the release workflows build it, without install scripts.
      - name: Setup Node.js for the dev UI
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: typescript/dev-ui/package-lock.json

      - name: Build the dev UI
        working-directory: typescript/dev-ui
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Clippy
        env:
          A4_REQUIRE_DEV_UI: "1"
        run: cargo clippy --workspace --locked -- -D warnings

  # The repository ruleset requires a check named exactly `Rust`. The Rust
  # checks run as four parallel jobs; this one carries the required name
  # and fails unless each of them succeeded, or skipped because `changes`
  # decided it could. A job skipped for any other reason, such as a cancelled
  # run, still fails. `if: always()` keeps it reporting in those cases instead
  # of being skipped itself.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: [changes, rust-workspace, rust-features, rust-consumers, rust-clippy]
    if: always()
    steps:
      - name: Require every Rust job to have succeeded or been ruled out
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq '{changes: .changes.outputs} * (del(.changes) | map_values(.result))' <<<"$NEEDS"
          jq -e '.changes.outputs as $decided | del(.changes) | to_entries
            | all(.value.result == "success" or (.value.result == "skipped" and $decided[.key] == "false"))' <<<"$NEEDS"

  generated-example-sdks:
    name: Generated Example SDKs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.generated-example-sdks != 'false' }}
    runs-on: ubuntu-latest
    env:
      # The CLI, the standalone ORE stack and the Rust example share one target
      # directory, so the cached dependencies serve all three.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: generated-example-sdks
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            examples/ore-typescript/package-lock.json

      - name: Test example SDK pin checks
        run: node --test scripts/check-example-sdk-pins.test.mjs

      - name: Regenerate example SDKs
        run: bash ./scripts/generate-example-sdks.sh

      - name: Check generated SDKs and ORE AST are committed
        run: |
          if [[ -n "$(git status --porcelain -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated)" ]]; then
            git status --short -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated
            exit 1
          fi

      - name: Regenerate example SDKs a second time
        run: bash ./scripts/generate-example-sdks.sh

      - name: Check SDK generation is deterministic
        run: |
          if [[ -n "$(git status --porcelain -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated)" ]]; then
            git status --short -- stacks/ore/.arete examples/ore-react/src/generated examples/ore-typescript/src/generated examples/ore-rust/src/generated
            exit 1
          fi

      - name: Record SDK generation provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: example-sdk-provenance
          if-no-files-found: error
          path: |
            examples/ore-react/src/generated/sdk-provenance.json
            examples/ore-typescript/src/generated/sdk-provenance.json
            examples/ore-rust/src/generated/ore/sdk-provenance.json

      - name: Build local TypeScript SDK
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Compile managed account models and enum payload schemas
        run: |
          cargo test --locked -p arete-interpreter --test managed_solana
          node scripts/check-managed-solana-typescript.cjs

      - name: Type-check golden stack-name SDKs
        run: typescript/core/node_modules/.bin/tsc -p cli/tests/golden/stack-names/tsconfig.json

      - name: Type-check golden shared-IDL-type SDKs
        run: typescript/core/node_modules/.bin/tsc -p cli/tests/golden/shared-idl-types/tsconfig.json

      - name: Type-check golden SDKs under tsc --init options, with declaration emit
        run: typescript/core/node_modules/.bin/tsc -p cli/tests/golden/tsconfig.strict.json

      - name: Type-check the TypeScript example SDK under tsc --init options, with declaration emit
        run: typescript/core/node_modules/.bin/tsc -p examples/ore-typescript/tsconfig.strict.json

      - name: Install TypeScript example dependencies
        working-directory: examples/ore-typescript
        run: npm install ../../typescript/core --no-save

      - name: Strict compile TypeScript example
        working-directory: examples/ore-typescript
        run: npx tsc --noEmit

      - name: Test TypeScript example extensions
        working-directory: examples/ore-typescript
        run: npm test

      - name: Check Rust example
        run: cargo check --locked --manifest-path examples/ore-rust/Cargo.toml

  ore-react:
    name: ORE React App
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ore-react != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.18.0"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/adapters/kit/package-lock.json
            typescript/react/package-lock.json
            typescript/adapters/web3js/package-lock.json
            examples/ore-react/package-lock.json

      - name: Build local SDK
        working-directory: typescript/core
        run: npm ci && npm run build

      # React's lockfile links `@usearete/adapter-kit` to this checkout's Kit
      # adapter, so it is built before React.
      - name: Build local Kit adapter
        working-directory: typescript/adapters/kit
        run: npm ci && npm install ../../core --no-save --package-lock=false && npm run build

      - name: Build local React SDK
        working-directory: typescript/react
        run: npm ci && npm install ../core ../adapters/kit --no-save --package-lock=false && npm run build

      - name: Build local web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm ci && npm install ../../core --no-save --package-lock=false && npm run build

      - name: Install app dependencies
        working-directory: examples/ore-react
        run: npm install ../../typescript/core ../../typescript/react ../../typescript/adapters/web3js --no-save

      - name: Install Chromium
        working-directory: examples/ore-react
        # `--with-deps` runs `apt-get update`, which reads every source the runner image ships —
        # including Google's Chrome repo. Playwright needs none of it, and a corrupt index there
        # (`Hash Sum mismatch`, seen 2026-09-09) fails the whole job for an unrelated reason. Drop
        # the source first so the update only covers what we actually install from.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: examples/ore-react
        run: npm run typecheck

      - name: Lint
        working-directory: examples/ore-react
        run: npm run lint

      - name: Unit and component tests
        working-directory: examples/ore-react
        run: npm test

      - name: Build
        working-directory: examples/ore-react
        run: npm run build

      - name: Disconnected browser tests
        working-directory: examples/ore-react
        run: npm run test:e2e

      - name: Verify one SDK version
        working-directory: examples/ore-react
        run: npm ls @usearete/sdk

  typescript-core:
    name: TypeScript Core
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-core != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: typescript/core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  typescript-hash:
    name: TypeScript Hash
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-hash != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/hash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: typescript/hash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test packed package boundary
        run: npm run test:pack

  typescript-dev-ui:
    name: TypeScript Dev UI
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-dev-ui != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/dev-ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: typescript/dev-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Typechecks, then builds what build.rs embeds into a4.
      - name: Build
        run: npm run build

  typescript-protocol:
    name: TypeScript Protocol
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-protocol != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            typescript/hash/package-lock.json
            typescript/protocol/package-lock.json
            typescript/core/package-lock.json

      - name: Build hash dependency
        working-directory: typescript/hash
        run: npm ci && npm run build

      # A build test bundles a generated program module against the SDK
      # source (`@usearete/sdk/program`), which needs the SDK's dependencies.
      - name: Install SDK dependencies
        working-directory: typescript/core
        run: npm ci

      - name: Install dependencies
        working-directory: typescript/protocol
        run: npm ci

      - name: Build
        working-directory: typescript/protocol
        run: npm run build

      - name: Typecheck
        working-directory: typescript/protocol
        run: npm run typecheck

      - name: Lint
        working-directory: typescript/protocol
        run: npm run lint

      - name: Test
        working-directory: typescript/protocol
        run: npm test

      - name: Verify protocol release guards
        run: python3 scripts/test-protocol-release.py

  # The signer-policy vectors this package runs are generated by the Rust MCP
  # signer; rust-workspace fails when they are stale.
  typescript-automations:
    name: TypeScript Automations
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-automations != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/automations
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/automations/package-lock.json

      # The lockfile links @usearete/sdk to ../core.
      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # The Postgres store, against every supported major version.
  typescript-automations-postgres:
    name: TypeScript Automations (Postgres ${{ matrix.postgres }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-automations-postgres != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: typescript/automations
    env:
      ARETE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/automations/package-lock.json

      # The lockfile links @usearete/sdk to ../core.
      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Test the Postgres store
        run: npx vitest run src/postgres

  typescript-adapters:
    name: TypeScript Adapters
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-adapters != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.18.0"
          cache: "npm"
          cache-dependency-path: |
            typescript/core/package-lock.json
            typescript/adapters/kit/package-lock.json
            typescript/adapters/web3js/package-lock.json

      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      - name: Install Kit adapter dependencies
        working-directory: typescript/adapters/kit
        run: npm ci && npm install ../../core --no-save --package-lock=false

      - name: Typecheck Kit adapter
        working-directory: typescript/adapters/kit
        run: npm run typecheck

      - name: Test Kit adapter
        working-directory: typescript/adapters/kit
        run: npm test

      - name: Build Kit adapter
        working-directory: typescript/adapters/kit
        run: npm run build

      - name: Pack-smoke Kit adapter
        working-directory: typescript/adapters/kit
        run: node pack-smoke.mjs

      - name: Install web3.js adapter dependencies
        working-directory: typescript/adapters/web3js
        run: npm ci && npm install ../../core --no-save --package-lock=false

      - name: Typecheck web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm run typecheck

      - name: Test web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm test

      - name: Build web3.js adapter
        working-directory: typescript/adapters/web3js
        run: npm run build

      - name: Pack-smoke web3.js adapter
        working-directory: typescript/adapters/web3js
        run: node scripts/pack-smoke.mjs

  typescript-react:
    name: TypeScript React
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript-react != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Build core dependency
        working-directory: typescript/core
        run: npm ci && npm run build

      # `@usearete/react/wallet-standard` is built and tested against the
      # Kit adapter from this checkout, like core.
      - name: Build Kit adapter dependency
        working-directory: typescript/adapters/kit
        run: npm ci && npm install ../../core --no-save --package-lock=false && npm run build

      - name: Install dependencies
        working-directory: typescript/react
        run: npm ci && npm install ../core ../adapters/kit --no-save --package-lock=false

      - name: Typecheck
        working-directory: typescript/react
        run: npm run typecheck

      - name: Lint
        working-directory: typescript/react
        run: npm run lint

      - name: Build
        working-directory: typescript/react
        run: npm run build

      - name: Test
        working-directory: typescript/react
        run: npm test

      - name: Pack and public-export smoke
        working-directory: typescript/react
        run: |
          npm pack --dry-run --json >/tmp/arete-react-pack.json
          node --input-type=module -e "const sdk = await import('./dist/index.esm.js'); for (const name of ['AreteProvider', 'useArete', 'useAsyncRead', 'createProcessedSlotReconciliation', 'formatRawToUi', 'summarizeStatuses', 'isHostedAreteEndpoint']) { if (!(name in sdk)) throw new Error('Missing ESM export: ' + name); } for (const removed of ['useView', 'useEntity']) { if (removed in sdk) throw new Error('Removed ESM export still present: ' + removed); }"
          node -e "const sdk = require('./dist/index.cjs'); for (const name of ['AreteProvider', 'useArete', 'useAsyncRead', 'createProcessedSlotReconciliation', 'formatRawToUi', 'summarizeStatuses', 'isHostedAreteEndpoint']) { if (!(name in sdk)) throw new Error('Missing CJS export: ' + name); } for (const removed of ['useView', 'useEntity']) { if (removed in sdk) throw new Error('Removed CJS export still present: ' + removed); }"
          node -e "const plugin = require('./eslint-plugin.cjs'); if (!plugin.rules?.['fluent-hooks']) throw new Error('Missing fluent-hooks ESLint rule');"

  python-matrix:
    name: Python ${{ matrix.python-version }} (${{ matrix.extras }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python-matrix != 'false' }}
    # The SDK supports Python 3.9, which setup-python does not provide on
    # Ubuntu 26.04, the image ubuntu-latest is moving to.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python/arete-sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base install: solders is absent, so the optional adapter suite is
          # not collected and the core SDK must work without it.
          - python-version: "3.9"
            extras: dev
          - python-version: "3.11"
            extras: dev
          # Optional solders transaction adapter; solders needs Python >= 3.10.
          - python-version: "3.10"
            extras: dev,solana
          - python-version: "3.11"
            extras: dev,solana
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install package with dev extras
        run: python -m pip install -e '.[${{ matrix.extras }}]'

      - name: Require the adapter dependency
        if: contains(matrix.extras, 'solana')
        run: python -c "import solders; print('solders', solders.__version__)"

      - name: Run tests
        run: python -m pytest

      # Separate invocations ensure neither module can disappear from collection
      # while the other suite still makes pytest succeed.
      - name: Run the solders adapter suite
        if: contains(matrix.extras, 'solana')
        run: python -m pytest tests/test_solders_adapter.py

      - name: Run the generated solders integration
        if: contains(matrix.extras, 'solana')
        run: python -m pytest tests/test_generated_solders.py

  # The repository ruleset requires a check named exactly `Python`. A matrix
  # job cannot produce one — every member is named after its own cell — so
  # this aggregation job carries that name. `needs.<job>.result` for a matrix
  # is `success` only when every member succeeded. Like `Rust`, it also accepts
  # a skip that `changes` decided, and `if: always()` keeps it reporting when
  # the matrix fails or is cancelled, instead of leaving the check missing.
  python:
    name: Python
    runs-on: ubuntu-latest
    needs: [changes, python-matrix]
    if: always()
    steps:
      - name: Require the Python matrix to have succeeded or been ruled out
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq '{changes: .changes.outputs} * (del(.changes) | map_values(.result))' <<<"$NEEDS"
          jq -e '.changes.outputs as $decided | del(.changes) | to_entries
            | all(.value.result == "success" or (.value.result == "skipped" and $decided[.key] == "false"))' <<<"$NEEDS"

  docs:
    name: Docs
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust-solana-adapter:
    name: Rust Solana Adapter
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust-solana-adapter != 'false' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          # Also pins cargo runs outside the checkout (the generated crates
          # in temporary directories), which rust-toolchain.toml cannot reach.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          rustc --version | grep -F "rustc $channel "

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: rust-solana-adapter
          # Pull requests restore main's cache but never save their own, which
          # keeps the repository under its 10 GB cache limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The base install must stay unchanged for users who do not opt in.
      - name: Test base SDK without the adapter
        run: cargo test --locked -p arete-a4-sdk

      - name: Assert the default graph carries no Solana adapter crates
        run: |
          tree=$(cargo tree -p arete-a4-sdk -e normal)
          for crate in solana-address solana-message solana-transaction solana-instruction \
                       solana-keypair solana-signer solana-signature \
                       solana-compute-budget-interface wincode; do
            if echo "$tree" | grep -q "$crate v"; then
              echo "::error::$crate leaked into the default dependency graph"
              exit 1
            fi
          done

      - name: Test the adapter
        run: |
          cargo test --locked -p arete-a4-sdk --features solana-adapter
          cargo test --locked -p arete-a4-sdk --features solana-adapter --test solana_adapter
          cargo test --locked -p arete-a4-sdk --features solana-adapter --test generated_solana

      - name: Check the V1 example
        run: cargo check --locked -p arete-a4-sdk --features solana-adapter --example solana_v1

      - name: Clippy
        run: |
          cargo clippy --locked -p arete-a4-sdk --features solana-adapter -- -D warnings
          cargo clippy --locked -p arete-a4-sdk --features solana-adapter \
            --test solana_adapter --example solana_v1 -- -D warnings

  benchmarks:
    name: Benchmarks harness
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.benchmarks != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks
    # Typecheck and unit tests only; benchmark runs bill the sandbox and the
    # models and stay in benchmarks.yml.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: benchmarks/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  windows-cli-lifecycle:
    name: Windows CLI lifecycle
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.windows-cli-lifecycle != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $channel) { throw "Missing pinned Rust toolchain" }
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          shared-key: windows-cli-lifecycle
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Windows process checks and shutdown
        run: cargo test --locked -p a4-cli --bin a4 commands::dev::runtime::tests

      - name: Test session retention when shutdown fails
        run: cargo test --locked -p a4-cli --bin a4 shutdown_failure_preserves_session

      - name: Test relative protocol compiler paths
        run: cargo test --locked -p a4-cli --bin a4 commands::protocol_bin::tests

  # Records that this exact tree passed every job above. A pull_request run
  # checks out the merge commit GitHub would create, so when the base branch
  # has not moved before the merge, main gets this same tree and the release
  # workflow can accept this run instead of waiting for main's CI. Main pushes
  # always run in full. A run that skipped any job records nothing, because a
  # job is skipped when one it needs was: the release gate then waits for
  # main's full run. scripts/check-verified-tree-needs.sh keeps `needs`
  # complete.
  record-verified-tree:
    name: Record verified tree
    needs:
      - changes
      - check-crate-files
      - lockfile-sync
      - linked-release-versions
      - npm-cli-wrapper
      - npm-publish-auth
      - rust-workspace
      - rust-features
      - rust-consumers
      - rust-clippy
      - windows-cli-lifecycle
      - rust
      - generated-example-sdks
      - ore-react
      - typescript-core
      - typescript-hash
      - typescript-dev-ui
      - typescript-protocol
      - typescript-automations
      - typescript-automations-postgres
      - typescript-adapters
      - typescript-react
      - python-matrix
      - python
      - docs
      - rust-solana-adapter
      - benchmarks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - run: printf '%s\n' "$GITHUB_SHA" > verified-tree.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-tree-ci-${{ steps.tree.outputs.tree }}
          path: verified-tree.txt
          retention-days: 14
