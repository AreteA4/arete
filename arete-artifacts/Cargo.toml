[package]
name = "arete-artifacts"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Versioned public artifact schemas and legacy normalization for Arete"
keywords = ["arete", "artifacts", "solana", "schema"]
categories = ["data-structures", "encoding"]

[dependencies]
arete-hash = { path = "../arete-hash", version = "0.1.1" }
arete-idl = { path = "../arete-idl", version = "0.2.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
