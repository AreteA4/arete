[package]
name = "arete-a4-sdk"
version = "0.16.0"
edition.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
description = "Rust SDK client for connecting to Arete streaming servers"
readme = "README.md"
documentation = "https://docs.rs/arete-sdk"
keywords = ["arete", "streaming", "sdk", "client", "websocket"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["rustls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["tokio-tungstenite/native-tls"]
# Optional first-party Solana transaction adapter (legacy/v0/V1). Off by
# default: none of the crates below appear in the base dependency graph, so an
# existing user's install and Solana version are untouched.
solana-adapter = [
    "dep:five8_core",
    "dep:solana-address",
    "dep:solana-compute-budget-interface",
    "dep:solana-hash",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:wincode",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
flate2 = "1.0"
futures-util = { version = "0.3", features = ["sink"] }
pin-project-lite = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-pubkey = { version = "2.3", default-features = false, features = ["std", "sha2", "curve25519"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
tracing = "0.1"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = "2"

# Optional `solana-adapter` graph. The versions are the compatible set the
# upstream V1 examples use (solana-foundation/transaction-v1-examples,
# rust/Cargo.toml): these crates were split out of the old monolithic
# `solana-sdk` and are on independent major lines, so they cannot all carry
# the same version. `solana-address` is the canonical public-key type reached
# transitively by every crate here; the core SDK keeps its own
# `solana-pubkey` 2.x `Pubkey` and the adapter converts at the boundary via
# canonical bytes.

# `five8` 1.0 (reached through `solana-keypair`/`solana-signature`) accepts any
# `five8_core` below 2.0, and this workspace already pins `five8_core` 0.1 via
# `solana-address`'s base58 decoder, where `impl Error for DecodeError` sits
# behind `std`. Enabling it here keeps `solana-keypair` compiling without
# forcing a different `solana-address` line on the workspace.
five8_core = { version = "0.1", optional = true, features = ["std"] }
solana-address = { version = "2.7", optional = true, features = ["std", "copy", "decode"] }
solana-compute-budget-interface = { version = "3.1", optional = true }
solana-hash = { version = "4.6", optional = true, features = ["std", "copy"] }
solana-instruction = { version = "3.5", optional = true }
solana-keypair = { version = "3.1", optional = true }
solana-message = { version = "4.6", optional = true }
solana-signature = { version = "3.5", optional = true }
solana-signer = { version = "3.0", optional = true }
solana-transaction = { version = "4.3", optional = true, features = ["wincode", "blake3"] }
wincode = { version = "0.6", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
axum = "0.7"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }

[[example]]
name = "solana_v1"
required-features = ["solana-adapter"]
