[package]
name = "arete-mcp"
version = "0.48.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP (Model Context Protocol) server wrapping Arete streams for AI agent integration; runs as `a4 mcp` inside the a4 CLI"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
getrandom = "0.2"
dashmap = "6"
dirs = "5"
arete-solana-contracts = { version = "0.3.0", path = "../arete-solana-contracts", features = ["raw-capture"] }
arete-sdk = { package = "arete-a4-sdk", path = "../arete-a4-sdk", version = "0.48.1" }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.3", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
toml = "0.8"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1.4"
