[package]
name = "arete-mcp"
version = "0.8.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP (Model Context Protocol) server wrapping Arete streams for AI agent integration"
readme = "README.md"

[[bin]]
name = "a4-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dashmap = "6"
dirs = "5"
arete-sdk = { package = "arete-a4-sdk", path = "../arete-a4-sdk", version = "0.8.2" }
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.3", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1.4"
